# Groupe de serveurs vers lesquels Nginx répartit les requêtes
# (par défaut : chacun son tour = "round robin")
upstream backend {
    server web1:80 max_fails=1 fail_timeout=10s;
    server web2:80 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    # Évite que le navigateur "consomme" un tour avec sa demande d'icône
    location = /favicon.ico {
        return 204;
        access_log off;
    }

    location / {
        proxy_pass http://backend;

        # Transmet au serveur web les infos du vrai client
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Si un serveur ne répond pas en 2 s, on passe au suivant
        proxy_connect_timeout 2s;

        # En-tête visible avec curl -I : quel serveur a répondu ?
        add_header X-Served-By $upstream_addr always;
    }
}
